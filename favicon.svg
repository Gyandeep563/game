<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080B16" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20D9E8" />
      <stop offset="50%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#7C5CFC" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Target Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#20D9E8" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#7C5CFC" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Lightning Bolt -->
  <polygon points="34,8 18,34 30,34 26,56 46,26 34,26" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
